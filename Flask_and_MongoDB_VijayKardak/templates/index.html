<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flask Registration</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eef2f7;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background: white;
            padding: 35px;
            border-radius: 12px;
            width: 340px;
            box-shadow: 0 5px 20px #00000015;
        }
        h2 { text-align: center; color: #26344a; }
        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            box-sizing: border-box;
            border: 1px solid #ccd3dd;
            border-radius: 6px;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #2563eb;
            color: white;
            border: 0;
            border-radius: 6px;
            cursor: pointer;
        }
        .error {
            background: #fee2e2;
            color: #991b1b;
            padding: 10px;
            border-radius: 6px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>User Registration</h2>

        {% if error %}
            <p class="error">{{ error }}</p>
        {% endif %}

        <form method="POST">
            <input type="text" name="name"
                   placeholder="Enter your name"
                   value="{{ name or '' }}" required>

            <input type="email" name="email"
                   placeholder="Enter your email"
                   value="{{ email or '' }}" required>

            <button type="submit">Submit Details</button>
        </form>
    </div>

        <hr>
        <h2>To-Do List</h2>

        <form action="/submittodoitem" method="POST">
        <label for="itemId">Item ID</label>
        <input type="number" id="itemId" name="itemId" placeholder="Enter Item ID" required>
        <label for="itemUuid">Item UUID</label>
        <input type="text" id="itemUuid" name="itemUuid" placeholder="Enter Item UUID" required>
        <label for="itemHash">Item Hash</label>
        <input type="text" id="itemHash" name="itemHash" placeholder="Enter Item Hash" required>


            <input type="text" name="itemName"
                   placeholder="Enter item name" required>

            <textarea name="itemDescription"
                      placeholder="Enter item description"
                      required></textarea>

            <button type="submit">Add To-Do</button>
        </form>

</body>
</html>
